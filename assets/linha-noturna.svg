    <style>
      .mono{font-family:ui-monospace,'Liberation Mono',monospace}.name{font-family:'Arial Black','Liberation Sans',Arial,sans-serif;font-weight:900;letter-spacing:-4px}.train{animation:depart 10s linear infinite}.beacon{animation:breathe 4s ease-in-out infinite alternate}.signal{animation:relay 6s ease-in-out infinite}
