<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1100 408" width="1100" height="408" role="img" aria-labelledby="title desc">
  <title id="title">Daniel Heringer · Linha Noturna</title>
  <desc id="desc">Cartaz de metrô. Um expresso ciano atravessa uma cidade violeta sob um sol de coral. À esquerda, o letreiro Daniel Heringer.</desc>
